<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inköpskollen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3EF; --card:#FFFFFF; --ink:#18221E; --muted:#69736E; --line:#E2E5E0;
  --brand:#14694D; --brand-soft:#E2EFE8; --sign:#E8B500; --good:#1E8A5A; --warn:#C27C00; --bad:#C2432E; --band:#CFE5D8;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 20px rgba(20,40,30,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --card:#171F1C; --ink:#E7ECE9; --muted:#95A19B; --line:#26302C;
  --brand:#3FB384; --brand-soft:#1A2E25; --sign:#F0C21A; --good:#55C08C; --warn:#E3A93A; --bad:#E2715A; --band:#1F3E30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  --bg:#0E1412; --card:#171F1C; --ink:#E7ECE9; --muted:#95A19B; --line:#26302C;
  --brand:#3FB384; --brand-soft:#1A2E25; --sign:#F0C21A; --good:#55C08C; --warn:#E3A93A; --bad:#E2715A; --band:#1F3E30;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.price,.logo span{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.barin{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto}
.logo span{font-weight:800;font-size:20px;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}

.wrap{max-width:980px;margin:0 auto;padding:18px 16px 72px}
.intro h1{font-size:30px;line-height:1.1;margin:6px 0 4px;font-weight:800;letter-spacing:-.02em}
.intro p{margin:0;color:var(--muted);max-width:52ch}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sort{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sort select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* Cards */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:940px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{position:relative;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card .media{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;background:var(--band);overflow:hidden}
.media img,.media .art,.dimg img,.dimg .art{width:100%;height:100%;object-fit:cover;display:block}
.card.is-sold .media img,.card.is-sold .media .art{filter:grayscale(.55) brightness(.97)}
.stag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;margin-bottom:8px;letter-spacing:.01em}
.st-bid{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
.st-soon{background:var(--bg);color:var(--muted)}
.st-sale{background:var(--brand-soft);color:var(--brand)}
.st-sold{background:var(--ink);color:var(--card)}
.updated{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.pill{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 11px 5px 5px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pill b{display:grid;place-items:center;min-width:28px;height:28px;border-radius:999px;background:var(--c);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-size:14px}
.ribbon{position:absolute;left:10px;top:10px;background:var(--ink);color:var(--card);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;letter-spacing:.02em}
.annons{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card .body{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 16px 10px}
.price{font-size:24px;font-weight:800;letter-spacing:-.015em;line-height:1.1;font-variant-numeric:tabular-nums}
.was{font-size:13px;color:var(--muted);margin-top:2px}
.addr{font-weight:600;font-size:16px;margin-top:6px;overflow-wrap:anywhere}
.loc{color:var(--muted);font-size:14px}
.facts{font-size:14px;margin-top:8px;color:var(--ink)}
.kpis{display:flex;gap:8px;margin-top:12px}
.kpis span{flex:1;background:var(--brand-soft);border-radius:10px;padding:8px 10px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.kpis i{display:block;font-style:normal;font-weight:500;font-size:12px;color:var(--muted)}
.foot{display:flex;border-top:1px solid var(--line);margin-top:auto}
.tbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;padding:11px;font-size:14px;font-weight:600;color:var(--muted)}
.tbtn+.tbtn{border-left:1px solid var(--line)}
.tbtn.del{color:var(--bad)}
.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.add{margin:20px 0 6px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border:0;background:var(--brand);color:#fff;border-radius:14px;font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.empty{color:var(--muted)}

/* Panels */
.panel{background:var(--card);border-radius:14px;margin:14px 0;box-shadow:var(--shadow)}
summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;font-weight:400;color:var(--muted)}
details[open] summary::after{content:"−"}
.form{padding:2px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form label.full{grid-column:1/-1}
.form input,.form select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.form .chk input{width:20px;height:20px}
.hint{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0}
.danger{background:none;border:0;color:var(--bad);padding:10px 0;font-weight:700;justify-self:start;border-radius:8px}
.danger.armed{padding:10px 14px}
.how{padding:0 16px 16px;font-size:14px;color:var(--muted)}
.how p{margin:0 0 10px}.how b{color:var(--ink)}

/* Detail */
.detail{max-width:760px}
.dimg{position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--band);box-shadow:var(--shadow)}
.imgacts{position:absolute;left:10px;bottom:10px;display:flex;gap:8px}
.glass{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.head{padding:18px 2px 6px}
.head .price{font-size:32px}
.head h2{font-size:21px;margin:8px 0 0;font-weight:700;line-height:1.2}
.fchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:14px}
.fchip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;min-width:0}
.fchip i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.fchip b{font-size:15px;font-variant-numeric:tabular-nums}
.card2{background:var(--card);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card2 h3{margin:0 0 10px;font-size:17px;font-weight:700}
.soldbox{border-left:4px solid var(--ink);font-size:15px}
.market .mhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.market h3{margin:0}
.msub{font-size:13px;color:var(--muted);margin-top:2px;max-width:46ch}
.mnow{text-align:right;flex:none}
.mnow b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:800;line-height:1}
.mnow span{font-size:13px;font-weight:600}
.pos{color:var(--good)}.neg{color:var(--bad)}
.mchart{width:100%;height:auto;display:block;margin:10px 0 6px}
.mfacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mfacts span{background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.mfacts i{display:block;font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted)}
@media (max-width:560px){.mfacts{grid-template-columns:1fr 1fr}}
.mdist{margin-top:10px;border-top:1px solid var(--line)}
.mdist summary{padding:12px 0 6px;font-size:15px}
.tw2{overflow-x:auto}
.mdist table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mdist th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
.mdist td{padding:7px 4px;border-bottom:1px solid var(--line)}
.mdist td:not(:first-child),.mdist th:not(:first-child){text-align:right}
.mdist tr.hl td{font-weight:700;background:var(--brand-soft)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--brand-soft);border-radius:12px;padding:10px}
.st.stop{background:color-mix(in srgb,var(--sign) 22%,var(--card))}
.st i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.st b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.bn{margin:12px 0 0;font-size:14px;color:var(--muted)}
@media (max-width:420px){.st b{font-size:15px}}
.verdict{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.vt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;line-height:1.1}
.verdict p{margin:4px 0 0;font-size:16px}
.ruler{padding:0 6px}
.track{position:relative;height:56px}
.track .base{position:absolute;left:0;right:0;top:26px;height:4px;background:var(--line);border-radius:2px}
.track .band{position:absolute;top:18px;height:20px;background:var(--band);border-radius:5px}
.track .tick{position:absolute;top:10px;width:2px;height:36px;transform:translateX(-1px)}
.track .tick.max{background:var(--sign);width:4px;transform:translateX(-2px);border-radius:2px}
.track .tick.after{background:var(--good);height:28px;top:14px}
.track .tick.soldt{background:var(--ink);width:3px;height:40px;top:8px}
.track .pin{position:absolute;top:0;transform:translateX(-50%)}
.track .pin span{display:block;width:18px;height:18px;border-radius:50%;background:var(--brand);border:3px solid var(--card);margin-top:19px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.labels{position:relative;height:40px;font-size:13px;color:var(--muted)}
.labels div{position:absolute;transform:translateX(-50%);white-space:nowrap;text-align:center;line-height:1.25}
.labels b{display:block;color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.k{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.k i{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.k b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.k small{color:var(--muted);font-size:12.5px}
.scen{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:15px}
.scen .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.scen .note{grid-column:1/-1;color:var(--muted);font-size:13px}
.flags{list-style:none;margin:0;padding:0}
.flags li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.flags li:first-child{border-top:0;padding-top:2px}
.flags li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--c)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){.form{grid-template-columns:1fr}.kgrid{grid-template-columns:1fr 1fr}.k b{font-size:18px}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease,box-shadow .15s ease}.card:hover{transform:translateY(-2px)}}
</style>
</head>

function calc(o,s){if(+o.price>0)return calc0(o,s);const r0=calc0({...o,price:1},s);const r=calc0({...o,price:Math.round(r0.fair/1000)*1000},s);r.noPrice=true;return r}
function calc0(o,s){
  const a=+o.area||1, price=+o.price||0, ea=a+(+o.biarea||0)*(s.biVikt??30)/100;
  const adj=(o.form==='br'&&!o.compSame&&+o.compAvgift>0)?-((+o.avgift-+o.compAvgift)*12)/(s.kap/100):0;
  const fair=(+o.compKvm)*ea+adj;
  const after=(+o.renovKvm>0)?(+o.renovKvm)*ea+adj:fair;
  const renov=+o.renov||0;
  const uplift=after-fair-renov;
  const buyCost=o.form==='br'?0:price*0.015+825+(+o.pantbrev||0)*0.02;
  const maxBid=fair*(1-s.krav/100)+Math.max(0,uplift)*0.5-buyCost;
  const total=price+renov+buyCost;
  const net=v=>v*(1-s.maklare/100);
  const stressV=after*Math.pow(1-s.stress/100,1);
  const normV=after*Math.pow(1+s.tillvaxt/100,s.ar);
  const stressRes=net(stressV)-total;
  const normRes=net(normV)-total;
  const beDrop=1-total/net(after);
  const loan=price*(1-s.insats/100);
  const cash=price*s.insats/100+renov+buyCost;
  const interest=loan*(s.ranta/100)/12*0.7;
  const monthly=interest+(+o.avgift||0)+(+o.drift||0)+(+o.avgald||0)/12;
  const avgKvm=o.form==='br'?(+o.avgift)*12/a:0;
  const flags=[];let risk=15;
  if(o.form==='br'){
    if(avgKvm>800){risk-=5;flags.push(['bad',`Hög avgift: ${Math.round(avgKvm)} kr/m²/år. Normalt 600 till 700.`])}
    else if(avgKvm>650){risk-=2;flags.push(['warn',`Avgiften är något hög: ${Math.round(avgKvm)} kr/m²/år.`])}
    else flags.push(['good',`Rimlig avgift: ${Math.round(avgKvm)} kr/m²/år.`]);
    if(!+o.lanKvm){risk-=1;flags.push(['warn','Föreningens lån per m² okänt. Läs årsredovisningen.'])}
    else if(o.lanKvm>10000){risk-=6;flags.push(['bad',`Högt belånad förening: ${kr(o.lanKvm)}/m². Räntehöjningar slår direkt mot avgiften.`])}
    else if(o.lanKvm>5000){risk-=3;flags.push(['warn',`Måttlig belåning i föreningen: ${kr(o.lanKvm)}/m².`])}
    else flags.push(['good',`Låg belåning i föreningen: ${kr(o.lanKvm)}/m².`]);
    if(!o.compSame)flags.push(['warn','Jämförelsepriset kommer från en annan förening. Avgiftsskillnaden är inräknad.']);
  }
  if(o.form==='tr'){risk-=3;flags.push(['warn',`Tomträtt: avgäld ${kr(+o.avgald||0)}/år. Kolla nästa omreglering och friköpspris.`])}
  if(o.form==='ag')flags.push(['good','Äganderätt med egen mark. Ingen föreningsrisk.']);
  if(o.form!=='br'&&+o.taxv>0){const ktv=price/(+o.taxv),kts=ktv.toFixed(2).replace('.',','),ref=(typeof KT_NOW!=='undefined'?KT_NOW:1.42).toFixed(2).replace('.',',');
    flags.push(ktv<=1.2?['good',`K/T-kontroll: priset är ${kts} gånger taxeringsvärdet. Malmösnittet för villor är ${ref}, så priset ligger lågt.`]:ktv<=1.42?['warn',`K/T-kontroll: priset är ${kts} gånger taxeringsvärdet, nära Malmösnittet ${ref}.`]:['bad',`K/T-kontroll: priset är ${kts} gånger taxeringsvärdet, över Malmösnittet ${ref}.`])}
  if(renov>0)flags.push([uplift>0?'good':'bad',uplift>0?`Renoveringen ger cirka ${kr(uplift)} i värde utöver kostnaden.`:`Renoveringen kostar mer än den höjer värdet (${kr(uplift)}).`]);
  if(beDrop<0.05)flags.push(['bad',`Litet säkerhetsutrymme: priserna kan bara falla ${pct(Math.max(0,beDrop))} innan du går med förlust vid försäljning.`]);
  const dv=fair>0?price/fair-1:1;
  const s1=clamp((0.10-dv)/0.20,0,1)*60;
  const s2=clamp((beDrop+0.05)/0.15,0,1)*10;
  const run=((+o.avgift||0)+(+o.drift||0)+(+o.avgald||0)/12)/a;
  const s3=clamp((80-run)/60,0,1)*15;
  const score=Math.round(s1+s2+s3+clamp(risk,0,15)*10/15);
  const fl=v=>Math.floor(v/25000)*25000;
  let firstBid,bidNote;
  if(maxBid>=price){firstBid=fl(Math.min(price,maxBid*0.95));bidNote=firstBid>=price?'Starta på utropet. Det visar att du är seriös utan att driva upp priset.':'Starta strax under utropet och låt mäklaren komma tillbaka till dig.'}
  else if(maxBid>=price*0.9){firstBid=fl(Math.max(price*0.9,maxBid*0.95));if(firstBid>maxBid)firstBid=fl(maxBid);bidNote='Starta under utropet. Säljaren kan tacka nej, men det sätter ankaret lågt. Höj bara om det finns konkurrens.'}
  else{firstBid=fl(maxBid*0.95);bidNote='Ditt maxbud ligger långt under utropet. Lägg bara ett chansbud om budgivningen uteblir eller priset sänks.'}
  return {firstBid,bidNote,fair,after,uplift,buyCost,maxBid,stressV,normV,stressRes,normRes,beDrop,loan,cash,monthly,interest,avgKvm,flags,score,diff:(price-maxBid)/maxBid};
}

function sentence(o,r){
  const d=r.diff;
  if(d<=-0.03)return r.score<50?`Priset ligger <b>${pct(-d)} under</b> ditt maxbud, men höga löpande kostnader eller litet säkerhetsutrymme drar ner betyget.`:`Priset ligger <b>${pct(-d)} under</b> ditt maxbud. Här finns utrymme.`;

}

  const area=`M${X(0)},${Y(lo)} L`+k.map((v,i)=>X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' L')+` L${X(n-1)},${Y(lo)} Z`;
  const grid=[1.2,1.3,1.4].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(1).replace('.',',')}</text>`).join('');

  return `<section class="card2 market"><div class="mhead"><div><h3>Marknaden i Malmö</h3><div class="msub">Villor, slutpris delat med taxeringsvärde (K/T). ${MARKET.source}, ${MARKET.asOf}.</div></div>
   <div class="mnow"><b>${KT_NOW.toFixed(2).replace('.',',')}</b><span class="pos">${fmt(ch(12))} på 12 mån</span></div></div>
   <svg viewBox="0 0 ${W} ${H}" class="mchart" role="img" aria-label="K/T för villor i Malmö de senaste 48 månaderna">${grid}<path d="${area}" fill="var(--brand-soft)"/><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(n-1)}" cy="${Y(k[n-1])}" r="4.5" fill="var(--brand)" stroke="var(--card)" stroke-width="2"/>${yrs}</svg>
   <div class="mfacts"><span><i>Botten vintern 2022/23</i>1,19</span><span><i>Förra toppen 2021</i>1,35</span><span><i>Största fall sedan 1996</i>cirka 10 %</span><span><i>Snitt 10 år</i>+4,2 %/år</span></div>
   <details class="mdist"><summary>Bostadsrätter per område</summary><div class="tw2"><table><thead><tr><th>Område</th><th>kr/m²</th><th>3 mån</th><th>12 mån</th></tr></thead><tbody>${rows}</tbody></table></div></details></section>`;
}

<p><b>Marknadsvärde</b> = jämförbart slutpris per m² × boarea, plus biarea (källare, garage) värderad till 30 % av boarean. Kommer jämförelsen från en annan förening justeras värdet för avgiftsskillnaden.</p>

function shrink(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}

    <div>Priserna stiger ${s.tillvaxt} % per år</div><div class="r" style="color:${r.normRes<0?'var(--bad)':'var(--good)'}">${r.normRes<0?'Förlust ':'Plus '}${kr(Math.abs(r.normRes))}</div>
    <div class="note">Efter mäklararvode${r.buyCost?', lagfart':''}${+o.renov?' och renovering':''}, före vinstskatt (22 % om du bott där). Ett fall på 10 % motsvarar det största prisfallet för villor i Malmö sedan 1996 (2022 till 2023), och det var återhämtat inom tre år.</div></div></section>
  <section class="card2"><h3>Att kontrollera</h3><ul class="flags">${r.flags.map(([k,txt])=>`<li style="--c:var(--${k})">${txt}</li>`).join('')}</ul></section>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
load();render();
</script>
