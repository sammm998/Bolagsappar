<style>
:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface2: #F1F5F9;
  --border: #E2E8F0;
  --text: #0F172A;
  --text-muted: #64748B;
  --accent: #F59E0B;
  --green: #10B981;
  --green-bg: #D1FAE5;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface2: #334155;
    --border: #334155;
    --text: #F1F5F9;
    --text-muted: #94A3B8;
    --green: #34D399;
    --green-bg: #064E3B;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #0F172A;
  --surface: #1E293B;
  --surface2: #334155;
  --border: #334155;
  --text: #F1F5F9;
  --text-muted: #94A3B8;
  --green: #34D399;
  --green-bg: #064E3B;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 0;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  box-shadow: var(--shadow);
}
.header-top {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; margin-bottom: 14px;
}
.logo-mark {
  width: 34px; height: 34px; background: var(--accent);
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 18px; flex-shrink: 0;
}
.header-title { font-size: 16px; font-weight: 700; }
.header-sub { font-size: 12px; color: var(--text-muted); }
.stats { display: flex; gap: 20px; margin-left: auto; }
.stat { text-align: right; }
.stat-num {
  font-size: 20px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.stat-lbl {
  font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .05em;
}
.tabs {
  display: flex; border-top: 1px solid var(--border); margin: 0 -20px;
}
.tab {
  padding: 10px 20px; font-size: 13px; font-weight: 500;
  color: var(--text-muted); cursor: pointer; border: none;
  background: none; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s; font-family: inherit;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.toolbar {
  padding: 12px 20px; background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center;
}
.search-wrap { position: relative; flex: 1; }
.search-wrap svg {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%); color: var(--text-muted); pointer-events: none;
}
#search {
  width: 100%; padding: 8px 12px 8px 34px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 13px; font-family: inherit; outline: none;
  transition: border-color .15s;
}
#search:focus { border-color: var(--accent); }
#count-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 10px 16px; text-align: left;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-muted);
  background: var(--surface2); border-bottom: 1px solid var(--border);
  white-space: nowrap; cursor: pointer; user-select: none;
}
thead th:hover { color: var(--text); }
thead th.sorted { color: var(--accent); }
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:hover { background: var(--surface2); }
tbody td { padding: 11px 16px; vertical-align: middle; }
td.rn { color: var(--text-muted); font-size: 11px; width: 40px; padding-right: 4px; font-variant-numeric: tabular-nums; }
td.mono { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.no-results { text-align: center; padding: 48px 20px; color: var(--text-muted); }
@media (max-width: 600px) {
  .stats { display: none; }
  thead th:nth-child(4), tbody td:nth-child(4),
  thead th:nth-child(6), tbody td:nth-child(6) { display: none; }
}
</style>
