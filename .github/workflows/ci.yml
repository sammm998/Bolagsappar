name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint och tankstreck
        run: pnpm lint
      - name: Typer
        run: pnpm typecheck
      - name: Motorer, API, guider och moduler (jämförelsetester mot legacy)
        run: pnpm test
      - name: seed.sql är uppdaterad
        run: node scripts/gen-seed-sql.mjs && git diff --exit-code supabase/seed.sql
      - name: RLS mot riktig Postgres
        run: pnpm test:rls
      - name: Bygg
        run: pnpm build
